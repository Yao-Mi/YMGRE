  <text x="44" y="148" font-family="sans-serif" font-size="88" font-weight="800" letter-spacing="5" fill="#f4f8ff">YMGRE</text>
  <text x="49" y="184" font-family="sans-serif" font-size="21" letter-spacing="1" fill="#a9c1d9">C99. CPU. A world of triangles and rays.</text>
  <g font-family="monospace" font-size="12" letter-spacing="1" fill="#b7d7ed">
    <rect x="48" y="214" width="151" height="30" rx="6" fill="#172a40"/><text x="63" y="234">RASTERIZATION</text>
    <rect x="210" y="214" width="136" height="30" rx="6" fill="#172a40"/><text x="225" y="234">RAY TRACING</text>
    <rect x="357" y="214" width="128" height="30" rx="6" fill="#172a40"/><text x="372" y="234">16 / 32 BIT</text>
  </g>
  <g stroke="#78c8de" stroke-width="1.3" stroke-linejoin="round">
