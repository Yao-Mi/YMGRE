<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title desc">
  <title id="title">YMGRE — C99 CPU 3D Rendering</title>
  <desc id="desc">Project title artwork with a geometric wireframe cube. Rasterization, ray tracing, and a standalone SDK.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101a2c"/><stop offset="1" stop-color="#080f1c"/></linearGradient>
    <linearGradient id="top" x2="1" y2="1"><stop stop-color="#73e2de"/><stop offset="1" stop-color="#4e8acb"/></linearGradient>
    <linearGradient id="side" x2="0" y2="1"><stop stop-color="#355d99"/><stop offset="1" stop-color="#172d51"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#233751" stroke-width=".7"/></pattern>
  </defs>
  <rect width="1200" height="280" rx="18" fill="url(#bg)"/>
  <path d="M700 0H1182Q1200 0 1200 18V262Q1200 280 1182 280H700Z" fill="url(#grid)" opacity=".55"/>
